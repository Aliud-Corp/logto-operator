---
# CI of logto-operator, on GitHub-hosted runners only. The repository will become public: a fork's pull request must
# never run on self-hosted infrastructure, and `task ci:runners` (part of `task check`) fails on any other `runs-on`.
#
# While the repository is private, every minute counts against the organization's shared free quota, and an exhausted
# quota blocks every hosted job of the organization until the next month. Hence ONE job running the whole gate (each
# job is billed rounded up to the minute), the mise cache, and e2e in its own path-filtered workflow (e2e.yml).
#
# Every step calls a `task` target a developer calls locally: reproduce a red step by running the target it names.
# Public-repository hygiene: no `pull_request_target`, read-only token, no secret used anywhere, actions pinned by SHA.
#
# `name:` is a join key for anything triggering on `workflow_run`: do not rename it casually.
name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      # A documentation change must be able to trigger nothing.
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  # `head_ref` only exists on pull_request: every push to main gets its own group and never cancels another.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # generate drift (on EVERY push, not only on PR open), go mod tidy, runner guard, lint, unit tests, build.
  check:
    name: check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (from mise.toml)
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          cache: true
      - name: task check
        run: task check
