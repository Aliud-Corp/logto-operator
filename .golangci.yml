# golangci-lint v2. Generated files (header "Code generated ... DO NOT EDIT.") are excluded by default (`generated: lax`).
version: "2"
run:
  timeout: 5m
  # Lint the integration tests too (they are built only with this tag).
  build-tags:
    - integration
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Aliud-Corp/logto-operator
