# The only entry point of the repository: CI calls these targets and nothing else, so a red CI
# step is reproduced locally by running the target it names. Tools come from mise.toml (`mise install`).
version: '3'

vars:
  # The Logto support window, newest first. The newest generates the client; all of them are vendored for the
  # contract tests and the integration matrix.
  LOGTO_LATEST:
    sh: head -n 1 api/logto/versions.txt
  LOGTO_VERSION: '{{.LOGTO_VERSION | default .LOGTO_LATEST}}'
  SPEC: api/logto/{{.LOGTO_LATEST}}.openapi.json
  IT_COMPOSE: docker compose -f test/integration/compose.yaml
  # The normalized spec is an intermediate, never committed: the committed artefact is the generated Go code.
  CODEGEN_SPEC: build/management.codegen.json
  MGMT_DIR: internal/logto/mgmt
  # Every directory `task generate` writes into; `generate:check` guards them all.
  GENERATED_DIRS: internal/logto/mgmt api/v1alpha1 config/crd config/rbac api/logto internal/logto/version
  BIN_DIR: bin
  # The API server of `task test:envtest`: the minor of k8s.io/client-go in go.mod.
  ENVTEST_K8S: 1.37.0
  E2E_CLUSTER: logto-operator-e2e
  E2E_KUBECONFIG: build/e2e.kubeconfig
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - task --list

  generate:
    desc: Regenerate the Management API client, the normalized specs and version fingerprints, and the LogtoConfig deepcopy, CRD and JSON Schema (commit the result).
    # No `sources:` fingerprint on purpose: the drift guard below must ALWAYS regenerate, never trust a checksum.
    cmds:
      - mkdir -p build
      # Each vendored spec normalized for validation (what the tests load), and the fingerprints logtoctl recognises a
      # target's version by: the binary carries no spec.
      - go run ./tools/specwindow api/logto internal/logto/version/fingerprints.gen.go
      - go run ./tools/specnorm {{.SPEC}} {{.CODEGEN_SPEC}}
      - oapi-codegen -config {{.MGMT_DIR}}/oapi-codegen.types.yaml {{.CODEGEN_SPEC}}
      - oapi-codegen -config {{.MGMT_DIR}}/oapi-codegen.client.yaml {{.CODEGEN_SPEC}}
      - oapi-codegen -config {{.MGMT_DIR}}/oapi-codegen.server.yaml {{.CODEGEN_SPEC}}
      # The LogtoConfig schema: deepcopy and CRD from api/v1alpha1, then the JSON Schema of the CLI file from the CRD.
      - controller-gen object paths=./api/...
      - controller-gen crd paths=./api/... output:crd:artifacts:config=config/crd
      # The operator's ClusterRole, from the +kubebuilder:rbac markers of internal/operator.
      - controller-gen rbac:roleName=logto-operator paths=./internal/operator/... output:rbac:artifacts:config=config/rbac
      - go run ./tools/crd2schema config/crd/logto.aliud.fr_logtoconfigs.yaml api/v1alpha1/logtoconfig.schema.json

  generate:check:
    desc: Fail when the committed generated code differs from a fresh generation (drift guard, runs on every push).
    cmds:
      - task: generate
      - cmd: |
          if ! git diff --exit-code -- {{.GENERATED_DIRS}} || [ -n "$(git status --porcelain -- {{.GENERATED_DIRS}})" ]; then
            echo "generate:check FAILED: generated code ({{.GENERATED_DIRS}}) is not what its sources and the pinned generators produce." >&2
            echo "Run 'task generate' and commit the result." >&2
            exit 1
          fi

  tidy:check:
    desc: Fail when go.mod / go.sum are not tidy.
    cmds:
      - go mod tidy -diff

  build:
    desc: Build the CLI and the operator into bin/.
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN_DIR}}/logtoctl ./cmd/logtoctl
      - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN_DIR}}/logto-operator ./cmd/logto-operator

  image:
    desc: Build the operator's image for this machine's architecture into the local Docker daemon (ko.local/logto-operator). Needs Docker.
    env:
      VERSION: '{{.VERSION}}'
      KO_DOCKER_REPO: ko.local/logto-operator
    cmds:
      - ko build --bare --platform=linux/{{ARCH}} ./cmd/logto-operator

  image:build:
    desc: Build the operator's image for every platform of .ko.yaml without pushing it anywhere (no Docker needed; part of check).
    env:
      VERSION: '{{.VERSION}}'
      # Required by ko even when nothing is pushed; .invalid can never resolve.
      KO_DOCKER_REPO: example.invalid/logto-operator
    cmds:
      - ko build --bare --push=false ./cmd/logto-operator

  test:
    desc: Unit tests (no network, no Logto; the fake Management API runs in-process).
    cmds:
      - go test -race -count=1 ./...

  test:envtest:
    desc: The operator's manager and the install manifests (config/default) against a real API server (envtest; kube-apiserver and etcd fetched once into .cache/envtest).
    env:
      LOGTO_ENVTEST_REQUIRED: "1"
    cmds:
      - |
        KUBEBUILDER_ASSETS="$(setup-envtest use {{.ENVTEST_K8S}} --bin-dir {{.ROOT_DIR}}/.cache/envtest -p path)" \
          go test -race -count=1 -tags envtest -run 'AgainstARealAPIServer$' ./internal/operator/ ./test/manifests/

  lint:
    desc: golangci-lint on the Go code (generated files excluded), actionlint on the workflows, the runner guard.
    cmds:
      - golangci-lint run ./...
      - actionlint
      - task: ci:runners

  ci:runners:
    desc: Fail when a workflow runs on anything but a GitHub-hosted `ubuntu-<version>` runner (the repository goes public).
    cmds:
      - cmd: |
          bad=$(grep -nE '^[[:space:]]*runs-on:' .github/workflows/*.yml | grep -vE 'runs-on:[[:space:]]*ubuntu-[0-9]+\.[0-9]+[[:space:]]*$' || true)
          if [ -n "$bad" ]; then
            echo "ci:runners FAILED: only GitHub-hosted 'ubuntu-<version>' runners are allowed (no self-hosted, no expression):" >&2
            echo "$bad" >&2
            exit 1
          fi

  e2e:cluster:up:
    desc: Create (or reuse) the throwaway k3d cluster of the e2e suite. Needs a Docker daemon.
    status:
      - k3d cluster get {{.E2E_CLUSTER}} >/dev/null 2>&1
    cmds:
      - k3d cluster create --config test/e2e/k3d.yaml

  e2e:cluster:down:
    desc: Delete the e2e cluster.
    cmds:
      - k3d cluster delete {{.E2E_CLUSTER}}

  e2e:
    desc: Run the Chainsaw end-to-end suite against the k3d cluster (created if missing). Needs Docker; CI runs it in e2e.yml.
    deps: [e2e:cluster:up]
    cmds:
      - mkdir -p build
      # Its own kubeconfig file: the suite never touches the developer's current context.
      - k3d kubeconfig get {{.E2E_CLUSTER}} > {{.E2E_KUBECONFIG}}
      - KUBECONFIG={{.E2E_KUBECONFIG}} chainsaw test --config test/e2e/.chainsaw.yaml test/e2e

  it:up:
    desc: Start a throwaway Logto (LOGTO_VERSION, default the newest supported) on 127.0.0.1:3001/3002. Needs Docker.
    cmds:
      - LOGTO_VERSION={{.LOGTO_VERSION}} {{.IT_COMPOSE}} up -d --wait

  it:down:
    desc: Remove the throwaway Logto, its database and its volume.
    cmds:
      - LOGTO_VERSION={{.LOGTO_VERSION}} {{.IT_COMPOSE}} down --volumes --remove-orphans

  it:bootstrap:
    desc: Write the throwaway Logto's m-default credentials to build/it.env (mode 0600), read from its own database.
    cmds:
      - LOGTO_VERSION={{.LOGTO_VERSION}} IT_COMPOSE="{{.IT_COMPOSE}}" sh test/integration/bootstrap.sh

  it:
    desc: Integration tests against a throwaway Logto (LOGTO_VERSION). Not part of `check` (needs Docker).
    cmds:
      - task: it:up
      - task: it:bootstrap
      # -p 1: packages share the throwaway Logto, and a prune in one must not see another's objects appear.
      - LOGTO_IT_REQUIRED=1 go test -tags integration -count=1 -p 1 ./...

  it:all:
    desc: Integration tests on every version of the support window, one after the other (what CI runs on main).
    cmds:
      - for: { var: WINDOW, split: "\n" }
        cmd: task it:down LOGTO_VERSION={{.ITEM}} && task it LOGTO_VERSION={{.ITEM}}
      - task: it:down
    vars:
      WINDOW:
        sh: grep -v '^$' api/logto/versions.txt

  spec:refresh:
    desc: Vendor the spec served by Logto VERSION (restarts the throwaway Logto at that version). Usage - task spec:refresh VERSION=1.46.0
    requires:
      vars: [VERSION]
    cmds:
      - task: it:down
      - task: it:up
        vars: { LOGTO_VERSION: '{{.VERSION}}' }
      # `servers` echoes the request's host: always ask localhost:3001, so the file depends on the version only.
      - curl -sSf http://localhost:3001/api/swagger.json | jq -Sc . > build/spec-{{.VERSION}}.json
      - jq -e '.paths | length > 0' build/spec-{{.VERSION}}.json > /dev/null
      - mv build/spec-{{.VERSION}}.json api/logto/{{.VERSION}}.openapi.json
      - task: it:down
      - task: generate

  spec:diff:
    desc: Classify the differences between two vendored specs; fails on a breaking change of an operation the kinds use. Usage - task spec:diff FROM=1.44.0 TO=1.46.0
    requires:
      vars: [FROM, TO]
    cmds:
      - go run ./tools/specdiff -used tools/specdiff/used.txt api/logto/{{.FROM}}.openapi.json api/logto/{{.TO}}.openapi.json

  check:
    desc: The gate of ci.yml. Does not cover `task e2e` (e2e.yml, needs Docker).
    cmds:
      - task: generate:check
      - task: tidy:check
      - task: lint
      - task: test
      - task: test:envtest
      - task: build
      - task: image:build
