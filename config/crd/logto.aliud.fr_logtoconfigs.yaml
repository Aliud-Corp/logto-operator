---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: logtoconfigs.logto.aliud.fr
spec:
  group: logto.aliud.fr
  names:
    kind: LogtoConfig
    listKind: LogtoConfigList
    plural: logtoconfigs
    shortNames:
    - logtocfg
    singular: logtoconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LogtoConfig is the desired configuration of one Logto instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LogtoConfigSpec declares what the tool owns in one Logto tenant. Objects that reference each other are maps keyed
              by a local key (stable, ours), distinct from the Logto name (theirs, shown in the console).
            properties:
              applications:
                additionalProperties:
                  description: Application is matched by its Logto name and never
                    deleted or recreated.
                  properties:
                    customClientMetadata:
                      description: CustomClientMetadata of an application; undeclared
                        keys are left as Logto has them.
                      properties:
                        allowTokenExchange:
                          type: boolean
                        alwaysIssueRefreshToken:
                          type: boolean
                        corsAllowedOrigins:
                          items:
                            type: string
                          type: array
                        idTokenTtl:
                          format: int32
                          type: integer
                        refreshTokenTtlInDays:
                          format: int32
                          type: integer
                        rotateRefreshToken:
                          type: boolean
                      type: object
                    description:
                      type: string
                    name:
                      type: string
                    oidcClientMetadata:
                      description: OIDCClientMetadata of an application; URI lists
                        are compared as sets.
                      properties:
                        postLogoutRedirectUris:
                          items:
                            type: string
                          type: array
                        redirectUris:
                          items:
                            type: string
                          type: array
                      type: object
                    roles:
                      description: Roles granted to a MachineToMachine application,
                        by Logto name (e.g. "Logto Management API access").
                      items:
                        description: RoleRef names an existing Logto global role by
                          name.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    secret:
                      description: 'Secret of a MachineToMachine application: one
                        usable secret is ensured and published, never rotated.'
                      properties:
                        publish:
                          type: boolean
                      required:
                      - publish
                      type: object
                    type:
                      description: Type cannot change once the application exists
                        in Logto.
                      enum:
                      - Native
                      - SPA
                      - Traditional
                      - MachineToMachine
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: object
              connectors:
                additionalProperties:
                  description: Connector is a passwordless connector. M1 supports
                    the SMTP e-mail connector.
                  properties:
                    connectorId:
                      description: ConnectorID is the factory id, e.g. simple-mail-transfer-protocol.
                      type: string
                    id:
                      description: 'ID is the connector id in Logto (declared: Logto
                        accepts it at creation).'
                      type: string
                    smtp:
                      description: SMTPConfig is the config of the simple-mail-transfer-protocol
                        connector.
                      properties:
                        auth:
                          description: SMTPAuth are the SMTP credentials; both are
                            required by the connector.
                          properties:
                            pass:
                              description: 'SecretSource is a secret: it is never
                                written in the document.'
                              properties:
                                valueFrom:
                                  description: |-
                                    ValueFrom names exactly one place a value is read from. The CLI reads env and file; the operator reads
                                    secretKeyRef.
                                  properties:
                                    env:
                                      type: string
                                    file:
                                      type: string
                                    secretKeyRef:
                                      description: SecretKeyRef points at one key
                                        of a Kubernetes Secret in the namespace of
                                        the LogtoConfig.
                                      properties:
                                        key:
                                          type: string
                                        name:
                                          type: string
                                      required:
                                      - key
                                      - name
                                      type: object
                                  type: object
                              required:
                              - valueFrom
                              type: object
                            user:
                              description: StringSource is a value written in the
                                document, or read from the environment, a file or
                                a Secret.
                              properties:
                                value:
                                  type: string
                                valueFrom:
                                  description: |-
                                    ValueFrom names exactly one place a value is read from. The CLI reads env and file; the operator reads
                                    secretKeyRef.
                                  properties:
                                    env:
                                      type: string
                                    file:
                                      type: string
                                    secretKeyRef:
                                      description: SecretKeyRef points at one key
                                        of a Kubernetes Secret in the namespace of
                                        the LogtoConfig.
                                      properties:
                                        key:
                                          type: string
                                        name:
                                          type: string
                                      required:
                                      - key
                                      - name
                                      type: object
                                  type: object
                              type: object
                          required:
                          - pass
                          - user
                          type: object
                        fromEmail:
                          type: string
                        host:
                          type: string
                        ignoreTLS:
                          type: boolean
                        port:
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        replyTo:
                          type: string
                        secure:
                          type: boolean
                        templates:
                          description: Templates are listed, or read from a directory
                            of <usageType>.json files.
                          properties:
                            fromDir:
                              type: string
                            items:
                              items:
                                description: EmailTemplate is one template of the
                                  SMTP connector.
                                properties:
                                  content:
                                    description: TextSource is text written in the
                                      document, or read from a file relative to the
                                      document.
                                    properties:
                                      as:
                                        description: 'As is how a file is turned into
                                          the value: text (default) or dataUri (images).'
                                        enum:
                                        - text
                                        - dataUri
                                        type: string
                                      fromFile:
                                        type: string
                                      value:
                                        type: string
                                    type: object
                                  contentType:
                                    enum:
                                    - text/plain
                                    - text/html
                                    type: string
                                  subject:
                                    type: string
                                  usageType:
                                    type: string
                                required:
                                - content
                                - contentType
                                - subject
                                - usageType
                                type: object
                              type: array
                          type: object
                      required:
                      - auth
                      - fromEmail
                      - host
                      - port
                      - templates
                      type: object
                  required:
                  - connectorId
                  type: object
                type: object
              credentials:
                description: Credentials of the M2M application the tool authenticates
                  as.
                properties:
                  clientId:
                    description: StringSource is a value written in the document,
                      or read from the environment, a file or a Secret.
                    properties:
                      value:
                        type: string
                      valueFrom:
                        description: |-
                          ValueFrom names exactly one place a value is read from. The CLI reads env and file; the operator reads
                          secretKeyRef.
                        properties:
                          env:
                            type: string
                          file:
                            type: string
                          secretKeyRef:
                            description: SecretKeyRef points at one key of a Kubernetes
                              Secret in the namespace of the LogtoConfig.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        type: object
                    type: object
                  clientSecret:
                    description: 'SecretSource is a secret: it is never written in
                      the document.'
                    properties:
                      valueFrom:
                        description: |-
                          ValueFrom names exactly one place a value is read from. The CLI reads env and file; the operator reads
                          secretKeyRef.
                        properties:
                          env:
                            type: string
                          file:
                            type: string
                          secretKeyRef:
                            description: SecretKeyRef points at one key of a Kubernetes
                              Secret in the namespace of the LogtoConfig.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        type: object
                    required:
                    - valueFrom
                    type: object
                  tokenEndpoint:
                    description: |-
                      TokenEndpoint is where the client gets its token, when it is not the tenant endpoint (the m-default route uses
                      the console endpoint).
                    pattern: ^https?://
                    type: string
                required:
                - clientId
                - clientSecret
                type: object
              customProfileFields:
                additionalProperties:
                  description: CustomProfileField is a sign-up profile field, matched
                    by its name.
                  properties:
                    config:
                      description: Config is passed to Logto as is (its shape depends
                        on the type).
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    description:
                      type: string
                    label:
                      type: string
                    name:
                      type: string
                    required:
                      type: boolean
                    type:
                      type: string
                  required:
                  - label
                  - name
                  - type
                  type: object
                type: object
              endpoint:
                description: Endpoint is where the Management API answers (the tenant
                  endpoint).
                pattern: ^https?://
                type: string
              organizationRoles:
                additionalProperties:
                  description: OrganizationRole is a role of the organization template,
                    matched by its name.
                  properties:
                    description:
                      type: string
                    name:
                      type: string
                    organizationScopes:
                      description: OrganizationScopes are names declared in spec.organizationScopes;
                        the role holds exactly these.
                      items:
                        type: string
                      type: array
                    resourceScopes:
                      description: ResourceScopes are scopes of declared resources;
                        the role holds exactly these.
                      items:
                        description: ResourceScopeRef names a scope of a resource
                          declared in spec.resources, by local key and scope name.
                        properties:
                          resource:
                            type: string
                          scope:
                            type: string
                        required:
                        - resource
                        - scope
                        type: object
                      type: array
                  required:
                  - name
                  type: object
                type: object
              organizationScopes:
                additionalProperties:
                  description: Scope of an API resource or of the organization template.
                  properties:
                    description:
                      type: string
                  type: object
                type: object
              prune:
                description: Prune, per kind, deletes the Logto objects of that kind
                  that this document does not declare. Off by default.
                properties:
                  connectors:
                    type: boolean
                  customProfileFields:
                    type: boolean
                  keep:
                    description: |-
                      Keep lists objects never pruned, whatever the switches say: by name (organization scope and role, custom
                      profile field), by name or indicator (resource), by id (connector, which has no name of its own).
                    items:
                      type: string
                    type: array
                  organizationRoles:
                    type: boolean
                  organizationScopes:
                    type: boolean
                  resources:
                    type: boolean
                type: object
              resources:
                additionalProperties:
                  description: Resource is an API resource, matched by its indicator.
                  properties:
                    accessTokenTtl:
                      format: int32
                      minimum: 1
                      type: integer
                    indicator:
                      pattern: ^https?://
                      type: string
                    name:
                      type: string
                    scopes:
                      additionalProperties:
                        description: Scope of an API resource or of the organization
                          template.
                        properties:
                          description:
                            type: string
                        type: object
                      description: Scopes by name.
                      type: object
                  required:
                  - indicator
                  - name
                  type: object
                type: object
              signInExperience:
                description: SignInExperience lists the owned keys of the sign-in
                  experience; undeclared keys are left as Logto has them.
                properties:
                  branding:
                    description: 'Branding of the sign-in pages: URLs, or files turned
                      into data URIs.'
                    properties:
                      darkLogoUrl:
                        description: TextSource is text written in the document, or
                          read from a file relative to the document.
                        properties:
                          as:
                            description: 'As is how a file is turned into the value:
                              text (default) or dataUri (images).'
                            enum:
                            - text
                            - dataUri
                            type: string
                          fromFile:
                            type: string
                          value:
                            type: string
                        type: object
                      favicon:
                        description: TextSource is text written in the document, or
                          read from a file relative to the document.
                        properties:
                          as:
                            description: 'As is how a file is turned into the value:
                              text (default) or dataUri (images).'
                            enum:
                            - text
                            - dataUri
                            type: string
                          fromFile:
                            type: string
                          value:
                            type: string
                        type: object
                      logoUrl:
                        description: TextSource is text written in the document, or
                          read from a file relative to the document.
                        properties:
                          as:
                            description: 'As is how a file is turned into the value:
                              text (default) or dataUri (images).'
                            enum:
                            - text
                            - dataUri
                            type: string
                          fromFile:
                            type: string
                          value:
                            type: string
                        type: object
                    type: object
                  color:
                    description: Color of the sign-in pages.
                    properties:
                      darkPrimaryColor:
                        type: string
                      isDarkModeEnabled:
                        type: boolean
                      primaryColor:
                        type: string
                    required:
                    - primaryColor
                    type: object
                  customCss:
                    description: TextSource is text written in the document, or read
                      from a file relative to the document.
                    properties:
                      as:
                        description: 'As is how a file is turned into the value: text
                          (default) or dataUri (images).'
                        enum:
                        - text
                        - dataUri
                        type: string
                      fromFile:
                        type: string
                      value:
                        type: string
                    type: object
                  languageInfo:
                    description: LanguageInfo of the sign-in pages.
                    properties:
                      autoDetect:
                        type: boolean
                      fallbackLanguage:
                        type: string
                    type: object
                  signIn:
                    description: SignIn settings.
                    properties:
                      methods:
                        items:
                          description: SignInMethod is one sign-in method, in order.
                          properties:
                            identifier:
                              type: string
                            isPasswordPrimary:
                              type: boolean
                            password:
                              type: boolean
                            verificationCode:
                              type: boolean
                          required:
                          - identifier
                          type: object
                        type: array
                    required:
                    - methods
                    type: object
                  signUp:
                    description: SignUp settings.
                    properties:
                      identifiers:
                        items:
                          type: string
                        type: array
                      password:
                        type: boolean
                      verify:
                        type: boolean
                    required:
                    - identifiers
                    type: object
                  unknownSessionRedirectUrl:
                    type: string
                type: object
              users:
                additionalProperties:
                  description: User is an application-level administrator, matched
                    by its primary e-mail. Never a password.
                  properties:
                    name:
                      type: string
                    primaryEmail:
                      type: string
                    roles:
                      items:
                        description: RoleRef names an existing Logto global role by
                          name.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                  required:
                  - primaryEmail
                  type: object
                description: Users are application-level administrators only; users
                  from sign-up are never declared, never pruned.
                type: object
              variables:
                additionalProperties:
                  type: string
                description: Variables usable as ${name} in string fields of this
                  spec.
                type: object
            required:
            - credentials
            - endpoint
            type: object
          status:
            description: LogtoConfigStatus is written by the operator (milestone 3).
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
