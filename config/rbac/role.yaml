---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logto-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - logto.aliud.fr
  resources:
  - logtoconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - logto.aliud.fr
  resources:
  - logtoconfigs/status
  verbs:
  - get
  - patch
  - update
