# SKELETON test: proves the harness (k3d cluster + chainsaw + kubeconfig wiring), nothing of the operator yet.
# The operator's own scenarios (a LogtoConfig reconciled against a Logto 1.44.0 running in the cluster) replace it in
# milestone 3 (docs/plan.md).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke
spec:
  steps:
    - name: the cluster accepts and returns an object
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: smoke
              data:
                hello: world
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: smoke
              data:
                hello: world
